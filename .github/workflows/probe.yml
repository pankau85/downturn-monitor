name: Probe sources (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet xlrd==2.0.1
      - run: python pipeline/probe_sources.py
      - run: |
          git config user.name "downturn-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json
          git commit -m "probe: source diagnostics $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
