name: Refresh market data

on:
  schedule:
    # GitHub cron is UTC. 11:10 UTC = 6:10 am Chicago in summer (5:10 in winter): prior-day market closes.
    # 14:25 UTC = 9:25 am Chicago in summer (8:25 in winter): after the 8:30 ET economic releases.
    - cron: "10 11 * * 1-6"
    - cron: "25 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional extras (NY Fed workbook reader)
        run: pip install --quiet xlrd==2.0.1

      - name: Pull series from FRED and other public sources
        run: python pipeline/build_data.py --out data/data.json

      - name: Commit refreshed data
        run: |
          git config user.name "downturn-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # This step re-enables the schedule so the dashboard keeps updating unattended.
      - uses: gautamkrishnar/keepalive-workflow@v2
        continue-on-error: true
