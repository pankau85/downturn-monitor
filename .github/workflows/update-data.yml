name: Refresh market data

on:
  schedule:
    # GitHub cron is UTC. 11:10 UTC = 6:10 am Chicago in summer (5:10 in winter): prior-day market closes.
    # 14:25 UTC = 9:25 am Chicago in summer (8:25 in winter): after the 8:30 ET economic releases.
    - cron: "10 11 * * 1-6"
    - cron: "25 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional extras (NY Fed workbook reader)
        run: pip install --quiet xlrd==2.0.1

      - name: Pull series from FRED and other public sources
        run: python pipeline/build_data.py --out data/data.json

      - name: Rebuild the GitHub Pages copy and the standalone file from site/ sources
        run: |
          python pipeline/build_site.py --out index.html --live-url data/data.json --repo-url https://github.com/${{ github.repository }}
          python pipeline/build_site.py --out downturn-monitor.html --embed-data data/data.json --live-url https://raw.githubusercontent.com/${{ github.repository }}/main/data/data.json --repo-url https://github.com/${{ github.repository }}

      - name: Commit refreshed data
        run: |
          git config user.name "downturn-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html downturn-monitor.html
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Touching the workflow's enabled state through the API counts as activity and keeps the schedule alive.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable" || echo "keepalive skipped"
